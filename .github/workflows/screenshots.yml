name: Screenshots

# Renders the main screens for design review and commits the images to the
# branch screenshots/<branch>, so they can be fetched with git.
on:
  push:
    branches: ['design/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.screens.config.ts
      - name: Commit screenshots
        run: |
          target="screenshots/${GITHUB_REF_NAME}"
          cd screenshots
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: screenshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${target}"
